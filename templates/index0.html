<script>var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

// Change the icons inside the button based on previous settings
if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    themeToggleLightIcon.classList.remove('hidden');
} else {
    themeToggleDarkIcon.classList.remove('hidden');
}

var themeToggleBtn = document.getElementById('theme-toggle');

themeToggleBtn.addEventListener('click', function() {

    // toggle icons inside button
    themeToggleDarkIcon.classList.toggle('hidden');
    themeToggleLightIcon.classList.toggle('hidden');

    // if set via local storage previously
    if (localStorage.getItem('color-theme')) {
        if (localStorage.getItem('color-theme') === 'light') {
            document.documentElement.classList.add('dark');
            localStorage.setItem('color-theme', 'dark');
        } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('color-theme', 'light');
        }

    // if NOT set via local storage previously
    } else {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('color-theme', 'light');
        } else {
            document.documentElement.classList.add('dark');
            localStorage.setItem('color-theme', 'dark');
        }
    }
    
});

</script>
<script>
    var people = [];

    function setStatus(text) {
        $("#enrollStatus").text(text);
    }

    function errorText(xhr, fallback) {
        return (xhr.responseJSON && typeof xhr.responseJSON.detail === 'string') ? xhr.responseJSON.detail : fallback;
    }

    function selectedPerson() {
        var id = parseInt($("#personSelect").val());
        return people.find(function(p) { return p.id === id; });
    }

    function renderPeople(list) {
        people = list;
        var selected = $("#personSelect").val();
        var select = $("#personSelect").empty();
        if (!list.length) {
            select.append($("<option>").val("").text("Add a person first"));
        }
        var tbody = $("#authorizedListTable tbody").empty();
        list.forEach(function(p) {
            select.append($("<option>").val(p.id).text(p.name));

            var row = $("<tr>").addClass("border-b border-gray-300 dark:bg-gray-600 dark:text-white");
            row.append($("<td>").addClass("py-2").text(p.name));
            var images = p.encoded + "/" + p.images + " trained";
            if (p.pending) images += ", " + p.pending + " new";
            row.append($("<td>").addClass("text-sm").text(images));

            var badge = p.access_granted
                ? $("<button>").addClass("bg-green-200 text-green-800 py-1 px-2 rounded-full dark:bg-green-500 dark:text-green-200").text("Granted")
                : $("<button>").addClass("bg-red-200 text-red-800 py-1 px-2 rounded-full dark:bg-red-500 dark:text-red-200").text("Denied");
            badge.attr("title", "Click to " + (p.access_granted ? "deny" : "grant") + " access")
                .click(function() { setAccess(p, !p.access_granted); });
            row.append($("<td>").append(badge));

            var actions = $("<td>").addClass("whitespace-nowrap");
            actions.append($("<button>").addClass("text-blue-600 dark:text-blue-300 mr-3").attr("title", "Photos")
                .html('<i class="fas fa-images"></i>').click(function() { showPhotos(p); }));
            actions.append($("<button>").addClass("text-red-600 dark:text-red-300").attr("title", "Remove")
                .html('<i class="fas fa-trash"></i>').click(function() { removePerson(p); }));
            row.append(actions);
            tbody.append(row);
        });
        if (selected && list.some(function(p) { return String(p.id) === selected; })) {
            select.val(selected);
        }
    }

    function refreshPeople() {
        $.getJSON('/api/people', renderPeople);
    }

    function addPerson() {
        var name = $("#newPersonName").val().trim();
        if (!name) return;
        $.ajax({url: '/api/people', type: 'POST', contentType: 'application/json',
                data: JSON.stringify({name: name, access_granted: true})})
            .done(function(person) {
                $("#newPersonName").val("");
                $("#personSelect").append($("<option>").val(person.id).text(person.name)).val(person.id);
                setStatus(person.name + " added. Capture or upload a few photos, then train.");
            })
            .fail(function(xhr) { setStatus(errorText(xhr, "Could not add person")); });
    }

    function setAccess(person, granted) {
        $.ajax({url: '/api/people/' + person.id, type: 'PATCH', contentType: 'application/json',
                data: JSON.stringify({access_granted: granted})})
            .fail(function(xhr) { setStatus(errorText(xhr, "Could not change access")); });
    }

    function removePerson(person) {
        if (!confirm("Remove " + person.name + " and all their photos?")) return;
        $.ajax({url: '/api/people/' + person.id, type: 'DELETE'})
            .done(function() { setStatus(person.name + " removed"); })
            .fail(function(xhr) { setStatus(errorText(xhr, "Could not remove person")); });
    }

    function captureImage() {
        var person = selectedPerson();
        if (!person) { setStatus("Choose or add a person first"); return; }
        $.post('/api/people/' + person.id + '/capture')
            .done(function() { setStatus("Captured a photo of " + person.name + ". Press Train when done."); })
            .fail(function(xhr) { setStatus(errorText(xhr, "Capture failed")); });
    }

    function uploadImages() {
        var person = selectedPerson();
        var files = $("#file")[0].files;
        if (!person) { setStatus("Choose or add a person first"); return; }
        if (!files.length) return;
        var form = new FormData();
        for (var i = 0; i < files.length; i++) form.append("files", files[i]);
        $.ajax({url: '/api/people/' + person.id + '/images', type: 'POST', data: form,
                processData: false, contentType: false})
            .done(function(body) {
                var text = "Uploaded " + body.added.length + " photo(s) of " + person.name;
                if (body.rejected.length) text += "; skipped " + body.rejected.join(", ");
                setStatus(text + ". Press Train when done.");
                $("#file").val("");
                $('[data-modal-hide="default-modal"]').first().click();
            })
            .fail(function(xhr) { setStatus(errorText(xhr, "Upload failed")); });
    }

    var photosModal = null;

    function showPhotos(person) {
        $("#photosPersonName").text(person.name);
        var grid = $("#photosGrid").empty();
        $.getJSON('/api/people/' + person.id + '/images', function(images) {
            if (!images.length) grid.append($("<p>").addClass("dark:text-white").text("No photos yet"));
            images.forEach(function(image) {
                var labels = {pending: "not trained yet", encoded: "trained", no_face: "no face", failed: "unreadable"};
                var cell = $("<div>").addClass("text-center text-sm dark:text-white");
                cell.append($("<img>").attr("src", image.url).addClass("w-full h-32 object-cover rounded"));
                cell.append($("<span>").addClass(image.status === "encoded" ? "text-green-600" : "text-yellow-600")
                    .text(labels[image.status] || image.status));
                cell.append($("<button>").addClass("ml-2 text-red-600").html('<i class="fas fa-trash"></i>')
                    .click(function() {
                        $.ajax({url: '/api/images/' + image.id, type: 'DELETE'}).done(function() { cell.remove(); });
                    }));
                grid.append(cell);
            });
        });
        photosModal = photosModal || new Modal(document.getElementById('photos-modal'));
        photosModal.show();
    }

    function startTraining(full) {
        $.ajax({url: '/api/training', type: 'POST', contentType: 'application/json',
                data: JSON.stringify({full: full})})
            .always(function(_, __, xhr) {
                // 409 means a run is already going; either way, go watch it
                window.location.href = '/training';
            });
    }

    $(document).ready(function() {
        refreshPeople();

        $('#addPersonBtn').click(addPerson);
        $('#newPersonName').keypress(function(e) { if (e.which === 13) addPerson(); });
        $('#uploadBtn').click(uploadImages);
        $('#trainBtn').click(function() { startTraining(false); });
        $('#fullTrainBtn').click(function() {
            if (confirm("Re-encode every photo? This can take a while on the Pi.")) startTraining(true);
        });
        $('#photosCloseBtn').click(function() { if (photosModal) photosModal.hide(); });
        $('[data-modal-toggle="default-modal"]').click(function() {
            var person = selectedPerson();
            $("#uploadPersonName").text(person ? person.name : "(choose a person first)");
        });

        // Lock button click event
        $('#lockBtn').click(function() {
            $.ajax({
                url: '/api/lock',
                type: 'POST',
                success: function(response) {
                    console.log(response);  // Log success message
                },
                error: function(xhr, status, error) {
                    alert(errorText(xhr, "Lock failed"));
                }
            });
        });

        // Unlock button click event
        $('#unlockBtn').click(function() {
            $.ajax({
                url: '/api/unlock',
                type: 'POST',
                success: function(response) {
                    console.log(response);  // Log success message
                },
                error: function(xhr, status, error) {
                    alert(errorText(xhr, "Unlock failed"));
                }
            });
        });
    });
</script>
